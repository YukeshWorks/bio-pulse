name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Unit, integration and component tests
        run: npm test
      - name: Validate committed data
        run: npm run validate:data
      - name: Build
        run: npm run build
      - name: Verify build output
        run: npm run verify:dist
      - name: Install Chromium for responsive e2e checks
        run: npx playwright install --with-deps chromium
      - name: Responsive end-to-end checks (demo fixtures, never deployed)
        run: npm run test:e2e
