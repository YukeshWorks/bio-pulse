name: BioPulse daily update & deploy

on:
  schedule:
    # 07:00 Asia/Kolkata (IST = UTC+05:30, no daylight saving) = 01:30 UTC.
    # GitHub may start scheduled runs a few minutes late under load.
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: 'Rebuild and redeploy the site from committed data without fetching new records'
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**'
      - '**/*.md'

permissions:
  contents: write # commit generated data and archives back to the repository
  pages: write # deploy to GitHub Pages
  id-token: write # required by actions/deploy-pages

concurrency:
  group: biopulse-daily
  cancel-in-progress: false

jobs:
  update:
    name: Fetch, validate, archive and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      outcome: ${{ steps.pipeline.outputs.outcome }}
      pipeline_step: ${{ steps.pipeline.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and unit/integration tests
        run: |
          npx tsc -b
          npm test

      - name: Fetch sources and generate daily data
        id: pipeline
        if: github.event_name != 'push' && inputs.skip_fetch != true
        continue-on-error: true
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EPO_OPS_KEY: ${{ secrets.EPO_OPS_KEY }}
          EPO_OPS_SECRET: ${{ secrets.EPO_OPS_SECRET }}
          BIOPULSE_COMPANY_FEEDS: ${{ vars.BIOPULSE_COMPANY_FEEDS }}
          BIOPULSE_AI_MODEL: ${{ vars.BIOPULSE_AI_MODEL }}
          BIOPULSE_AI_DISABLE: ${{ vars.BIOPULSE_AI_DISABLE }}
        run: npm run pipeline

      - name: Restore last committed data after a pipeline crash
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "::error title=BioPulse::Pipeline crashed. Restoring the last committed dataset; the site will be redeployed with preserved data."
          git checkout -- public/data 2>/dev/null || true
          git clean -fdq -- public/data

      - name: Validate published data (schema, no demo data, archive consistency)
        run: npm run validate:data

      - name: Commit data and archive
        if: steps.pipeline.outcome == 'success'
        env:
          RUN_DATE: ${{ steps.pipeline.outputs.run_date }}
          OUTCOME: ${{ steps.pipeline.outputs.outcome }}
        run: |
          git config user.name "biopulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: daily update ${RUN_DATE} (${OUTCOME}) [skip ci]"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error title=BioPulse::Could not push data commit after 4 attempts."
          exit 1

      - name: Build site
        run: npm run build

      - name: Verify build output
        run: npm run verify:dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: update
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  alert:
    name: Alert on preserved (stale) data
    needs: [update, deploy]
    if: always() && (needs.update.outputs.outcome == 'preserved-previous' || needs.update.outputs.pipeline_step == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Fail visibly so the repository owner is notified
        run: |
          echo "::error title=BioPulse::No new data was published in this run; the previous dataset was preserved. Check the 'Fetch sources' step and status.json."
          exit 1
